<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract illustration of a modern rehabilitation and performance training space">
  <defs>
    <linearGradient id="bgGrad8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17171B"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
  </defs>
  <rect width="960" height="720" fill="url(#bgGrad8)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.04">
    <line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="0" y1="600" x2="960" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
  </g>

  <!-- floor line -->
  <line x1="0" y1="560" x2="960" y2="560" stroke="#2A2A2E" stroke-width="2"/>

  <!-- treatment plinth silhouette -->
  <rect x="90" y="510" width="220" height="18" rx="2" fill="#1B1B1F" stroke="#3A3A40" stroke-width="1.5"/>
  <line x1="110" y1="528" x2="110" y2="560" stroke="#3A3A40" stroke-width="4"/>
  <line x1="290" y1="528" x2="290" y2="560" stroke="#3A3A40" stroke-width="4"/>

  <!-- squat rack silhouette -->
  <g stroke="#3A3A40" stroke-width="4" fill="none">
    <line x1="620" y1="180" x2="620" y2="560"/>
    <line x1="740" y1="180" x2="740" y2="560"/>
    <line x1="620" y1="220" x2="740" y2="220"/>
    <line x1="620" y1="340" x2="740" y2="340"/>
  </g>
  <line x1="600" y1="300" x2="760" y2="300" stroke="#C9CDD3" stroke-width="3"/>

  <!-- wall-mounted screen for movement analysis -->
  <rect x="400" y="150" width="140" height="90" rx="4" fill="#131316" stroke="#3A3A40" stroke-width="2"/>
  <polyline points="415,215 440,195 460,205 485,175 510,190 525,165" fill="none" stroke="#BCA687" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- nexus node cluster suggesting integrated services -->
  <g stroke="#7C8794" stroke-opacity="0.4" stroke-width="1">
    <line x1="200" y1="470" x2="470" y2="330"/>
    <line x1="470" y1="330" x2="680" y2="470"/>
    <line x1="200" y1="470" x2="680" y2="470"/>
  </g>
  <g fill="#BCA687">
    <circle cx="200" cy="470" r="4"/>
    <circle cx="470" cy="330" r="4"/>
    <circle cx="680" cy="470" r="4"/>
  </g>

  <text x="40" y="680" font-family="Montserrat, sans-serif" font-size="12" letter-spacing="3" fill="#5C6169">NXS COLLECTIVE — PLACEHOLDER VISUAL</text>
</svg>
