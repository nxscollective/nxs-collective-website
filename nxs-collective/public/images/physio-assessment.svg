<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract illustration of a physiotherapist assessing a client's shoulder on a treatment plinth">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15151A"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="glow2" cx="42%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#C9CDD3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C9CDD3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="720" fill="url(#bgGrad2)"/>
  <rect width="960" height="720" fill="url(#glow2)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.04">
    <line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="0" y1="600" x2="960" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
  </g>

  <!-- plinth -->
  <rect x="280" y="470" width="420" height="20" rx="2" fill="#1B1B1F" stroke="#3A3A40" stroke-width="1.5"/>
  <line x1="310" y1="490" x2="310" y2="560" stroke="#3A3A40" stroke-width="4"/>
  <line x1="670" y1="490" x2="670" y2="560" stroke="#3A3A40" stroke-width="4"/>

  <!-- client lying supine -->
  <g stroke="#7C8794" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="330" cy="450" r="20"/>
    <path d="M350 452 H 620" />
    <path d="M430 452 L 460 420 L 500 452" />
    <path d="M560 452 L 600 430" />
    <path d="M620 452 L 660 470" />
  </g>

  <!-- therapist standing, hands at shoulder -->
  <g stroke="#C9CDD3" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="470" cy="270" r="22"/>
    <path d="M470 292 V 400" />
    <path d="M470 320 L 420 452" />
    <path d="M470 320 L 500 445" />
    <path d="M470 400 L 425 470" />
    <path d="M470 400 L 520 470" />
  </g>

  <circle cx="460" cy="420" r="4" fill="#BCA687"/>
  <line x1="460" y1="420" x2="540" y2="360" stroke="#BCA687" stroke-opacity="0.5" stroke-width="1"/>
  <text x="548" y="358" font-family="Montserrat, sans-serif" font-size="12" letter-spacing="2" fill="#BCA687">SHOULDER — ROM</text>

  <text x="40" y="680" font-family="Montserrat, sans-serif" font-size="12" letter-spacing="3" fill="#5C6169">NXS COLLECTIVE — PLACEHOLDER VISUAL</text>
</svg>
