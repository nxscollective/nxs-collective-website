<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract illustration of strength testing using a hand-held dynamometer">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15151A"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#BCA687" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#BCA687" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="720" fill="url(#bgGrad5)"/>
  <rect width="960" height="720" fill="url(#glow5)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.04">
    <line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="0" y1="600" x2="960" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
  </g>

  <!-- seated client, arm extended gripping dynamometer -->
  <g stroke="#7C8794" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="420" cy="280" r="24"/>
    <path d="M420 304 V 460" />
    <path d="M420 340 L 520 360" />
    <path d="M420 460 L 380 590" />
    <path d="M420 460 L 460 590" />
  </g>
  <line x1="420" y1="590" x2="420" y2="620" stroke="#3A3A40" stroke-width="4"/>

  <!-- dynamometer device -->
  <rect x="520" y="340" width="70" height="40" rx="6" fill="none" stroke="#C9CDD3" stroke-width="2.5"/>
  <line x1="590" y1="360" x2="620" y2="360" stroke="#C9CDD3" stroke-width="2.5"/>

  <!-- force readout graph -->
  <g transform="translate(640,220)">
    <rect x="0" y="0" width="230" height="130" fill="none" stroke="#3A3A40" stroke-width="1.5"/>
    <polyline points="10,110 40,90 70,60 100,40 130,45 160,30 190,55 220,20" fill="none" stroke="#BCA687" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="8" y="-10" font-family="Montserrat, sans-serif" font-size="12" letter-spacing="2" fill="#A6ACB5">FORCE OUTPUT</text>
  </g>

  <text x="40" y="680" font-family="Montserrat, sans-serif" font-size="12" letter-spacing="3" fill="#5C6169">NXS COLLECTIVE — PLACEHOLDER VISUAL</text>
</svg>
