<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Faint anatomical line art illustration of the human form used as a decorative graphic">
  <defs>
    <linearGradient id="bgGrad7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131316"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
  </defs>
  <rect width="960" height="720" fill="url(#bgGrad7)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.035">
    <line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="0" y1="600" x2="960" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
