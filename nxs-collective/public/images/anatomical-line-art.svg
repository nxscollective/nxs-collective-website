    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
  </g>

  <!-- symmetrical anatomical figure, front-facing, fine outline only -->
  <g stroke="#C9CDD3" stroke-opacity="0.6" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="480" cy="140" rx="46" ry="54" />
    <path d="M480 194 V 260" />
    <path d="M430 220 C 400 240, 390 280, 385 330" />
    <path d="M530 220 C 560 240, 570 280, 575 330" />
    <path d="M430 220 L 530 220" />
    <path d="M430 260 L 530 260" />
    <path d="M420 330 L 540 330" />
    <path d="M440 330 L 425 470" />
    <path d="M520 330 L 535 470" />
    <path d="M425 470 L 415 620" />
    <path d="M535 470 L 545 620" />
    <path d="M385 330 L 370 420" />
    <path d="M575 330 L 590 420" />
  </g>

  <!-- joint / node markers, biomechanics style -->
  <g fill="#BCA687" fill-opacity="0.85">
    <circle cx="480" cy="194" r="3"/>
    <circle cx="430" cy="220" r="3"/>
    <circle cx="530" cy="220" r="3"/>
    <circle cx="385" cy="330" r="3"/>
    <circle cx="575" cy="330" r="3"/>
    <circle cx="425" cy="470" r="3"/>
    <circle cx="535" cy="470" r="3"/>
