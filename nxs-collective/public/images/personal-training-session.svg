<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract illustration of a strength coach supervising a client during controlled resistance training">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17171B"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C9CDD3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C9CDD3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="720" fill="url(#bgGrad4)"/>
  <rect width="960" height="720" fill="url(#glow4)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.04">
    <line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="0" y1="600" x2="960" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
  </g>

  <!-- client mid-lift with barbell -->
  <g stroke="#7C8794" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="400" cy="270" r="22"/>
    <path d="M400 292 V 420" />
    <path d="M400 320 L 340 300" />
    <path d="M400 320 L 460 300" />
    <path d="M400 420 L 360 540" />
    <path d="M400 420 L 440 540" />
  </g>
  <!-- barbell -->
  <line x1="300" y1="300" x2="500" y2="300" stroke="#C9CDD3" stroke-width="3"/>
  <circle cx="300" cy="300" r="16" fill="none" stroke="#C9CDD3" stroke-width="3"/>
  <circle cx="500" cy="300" r="16" fill="none" stroke="#C9CDD3" stroke-width="3"/>

  <!-- coach observing with tablet -->
  <g stroke="#C9CDD3" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="640" cy="290" r="22"/>
    <path d="M640 312 V 430" />
    <path d="M640 335 L 590 380" />
    <path d="M640 335 L 690 375" />
    <path d="M640 430 L 605 540" />
    <path d="M640 430 L 665 540" />
  </g>
  <rect x="675" y="360" width="34" height="46" rx="3" stroke="#BCA687" stroke-width="2" fill="none"/>

  <circle cx="400" cy="360" r="4" fill="#BCA687"/>
  <line x1="400" y1="360" x2="330" y2="400" stroke="#BCA687" stroke-opacity="0.5" stroke-width="1"/>
  <text x="200" y="404" font-family="Montserrat, sans-serif" font-size="12" letter-spacing="2" fill="#BCA687">LOAD — CONTROLLED TEMPO</text>

  <text x="40" y="680" font-family="Montserrat, sans-serif" font-size="12" letter-spacing="3" fill="#5C6169">NXS COLLECTIVE — PLACEHOLDER VISUAL</text>
</svg>
